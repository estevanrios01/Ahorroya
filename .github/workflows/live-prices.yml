name: Live Prices

on:
  # Re-enabled on a fresh, empty free-tier Supabase project (the original
  # project's schedule ran every 30 minutes with no rotation/bounds and
  # exceeded the free tier's space budget). This one runs far less often
  # and every step below is already bounded (rotating subsets of
  # stores/terms, fixed product/page caps, Makro scoped to the pilot
  # cities), so recurring runs shouldn't reproduce that problem.
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:

concurrency:
  group: live-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - run: npm ci --include=optional
      - run: npm run prices:live
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIVE_SYNC_ALLOW_INSECURE_TLS: "1"
          LIVE_SYNC_PRODUCTS_PER_TERM: "180"
          # Bumped from 4/3 to 7/5 (checked first: DB is at 42MB of the
          # free tier's 500MB, ~8.4%, plenty of headroom) so the 14-store
          # rotation covers half its stores per run instead of under a
          # third, reaching full coverage roughly twice as fast. Per-request
          # size (LIVE_SYNC_PRODUCTS_PER_TERM) is unchanged, so this doesn't
          # change how aggressive any single scrape looks to a retailer.
          LIVE_SYNC_STORES_PER_RUN: "7"
          LIVE_SYNC_TERMS_PER_RUN: "5"
          LIVE_SYNC_BATCH_SIZE: "20"
          LIVE_SYNC_SKIP_IMAGES: "1"
          LIVE_SYNC_STORES: "exito,carulla,olimpica,jumbo,metro,mercaldas,megatiendas,euro,larebaja,colsubsidio,locatel,medipiel,bellapiel,pasteur"
      - run: npm run prices:makro
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Without MAKRO_CITIES or MAKRO_STORE_IDS set, import-makro-offers.js
          # falls back to importing every Makro branch nationally (potentially
          # 700-1000+), which is exactly the write volume that pushed the
          # original Supabase project over its free-tier space budget. Scoped
          # to the pilot cities agreed with the team (Cali, Bogotá, Medellín).
          MAKRO_CITIES: "Cali,Bogota,Medellin"
          IMPORT_BATCH_SIZE: "25"
          IMPORT_SKIP_PRODUCT_IMAGES: "1"
          IMPORT_SKIP_PRICE_HISTORY: "0"
      - run: npm run prices:farmatodo
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FARMATODO_TARGET_PRODUCTS: "200"
          FARMATODO_TERMS: "arroz,leche,aceite,acetaminofen,ibuprofeno,shampoo,crema"
          IMPORT_BATCH_SIZE: "25"
          IMPORT_SKIP_PRODUCT_IMAGES: "1"
          IMPORT_SKIP_PRICE_HISTORY: "0"
      - run: npm run prices:ara
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ARA_MAX_PAGES: "2"
          IMPORT_BATCH_SIZE: "25"
          IMPORT_SKIP_PRODUCT_IMAGES: "1"
          IMPORT_SKIP_PRICE_HISTORY: "0"
