name: Scrapers

on:
  # Re-enabled on the fresh, bounded Supabase project -- scoped to only the
  # two chains this script covers that the VTEX/Algolia/offers-API importers
  # in live-prices.yml don't: D1 and Cruz Verde, both major chains with real
  # Cali stores. The other RETAILERS entries (Exito, Jumbo, Ara, Carulla,
  # Olimpica, Makro, Farmatodo, La Rebaja) already get better, fuller-catalog
  # coverage from those dedicated importers, so running this generic
  # single-search-page scraper for them too would just add noisy duplicate
  # writes against the same store rows.
  schedule:
    - cron: "30 */5 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - run: npm ci --include=optional
      - run: npm run scrape -- d1 cruz-verde
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
