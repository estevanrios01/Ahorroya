name: Scrapers

on:
  # Schedule intentionally NOT enabled yet. A first manual run against D1 and
  # Cruz Verde (the two chains this script covers that aren't already better
  # covered by the VTEX/Algolia/offers-API importers in live-prices.yml)
  # showed both are blocked: D1's fetch fails outright (possibly a TLS trust
  # issue, see SCRAPE_ALLOW_INSECURE_TLS below) and Cruz Verde returns a page
  # with zero extractable products (likely bot-check/client-rendered shell,
  # not something a plain fetch+cheerio scrape can get past). Running this on
  # a schedule against sites that can't be reached would just burn CI minutes
  # for zero data. Trigger manually (workflow_dispatch) to test fixes; only
  # re-enable the schedule once a run actually writes real rows for d1/cruz-verde.
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - run: npm ci --include=optional
      - run: npm run scrape -- d1 cruz-verde
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_ALLOW_INSECURE_TLS: "1"
