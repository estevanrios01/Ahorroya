name: Scrapers

on:
  # Schedule intentionally NOT enabled. Diagnosed via two manual runs against
  # D1 and Cruz Verde (the two chains this script covers that aren't already
  # better covered by the VTEX/Algolia/offers-API importers in
  # live-prices.yml):
  #   - D1: fetch fails outright even with SCRAPE_ALLOW_INSECURE_TLS, which
  #     rules out a TLS trust problem. Most likely the runner's IP range is
  #     blocked at the network level -- not something fixable by changing
  #     this script.
  #   - Cruz Verde: the request succeeds (real 3.3KB response) but the body
  #     is an empty client-rendered app shell (<title></title>, no product
  #     data, no JSON-LD, no __NEXT_DATA__) -- the real page only exists
  #     after client-side JS runs. A fetch+cheerio scrape can never read
  #     this; it would need a real headless browser (Playwright) driving the
  #     page, which is a separate, bigger piece of work than this script.
  # Re-enable the schedule only once a manual run actually writes real
  # d1/cruz-verde rows.
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - run: npm ci --include=optional
      - run: npm run scrape -- d1 cruz-verde
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_ALLOW_INSECURE_TLS: "1"
